name: Check Zsh syntax

run-name: ${{ github.ref_type }} ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    paths: ['**.zsh']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh-check:
    runs-on: ubuntu-latest
    name: Check Zsh syntax
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - name: Cache Homebrew prefix
        uses: Homebrew/actions/cache-homebrew-prefix@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          install: zsh
          uninstall: true
          workflow-key: ${{ github.workflow }}
      - name: Check zsh syntax
        working-directory: src/fns
        run: |
          checked=0; err=0
          while read -r file; do
            if ! errmsg="$(zsh -fn -- "$file" 2>&1)"; then
              echo "::error file=${file}::${errmsg}"; ((++err))
            fi; ((++checked))
          done < <(find . -name '*.zsh' -type f)
          echo "Check **$checked** files: **$err** error(s)" >> "$GITHUB_STEP_SUMMARY"
          [[ $err -eq 0 ]] || exit 1

  zsh-lint:
    runs-on: ubuntu-latest
    name: Lint Zsh functions
    env:
      RESULT_FILE: "${{ github.sha }}-${{ github.run_attempt }}.json"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version: '1.27'
      - name: Install linter
        run: go install github.com/z-shell/zsh-lint/cmd/zsh-lint@v1.1.0
      - name: Run linter on zsh functions
        working-directory: ./src/fns
        run: zsh-lint --format=json functions/*.zsh functions/private/*.zsh > "${{ runner.temp }}/${{ env.RESULT_FILE }}"
      - name: Linter output
        env:
          NO_COLOR: ${{ true }}
        run: |
          res="${{ runner.temp }}/${{ env.RESULT_FILE }}"
          {
            echo "Check **$(jq '.summary.files' $res)** functions: **$(jq '.summary.errors' $res)** error(s)"
            echo '```json'
            jq --indent 2 '.summary' "$res"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          n=$(jq '.diagnostics | length' "$res")
          for ((i=0; i < n; i++)); do
            [[ $(jq ".diagnostics[$i].severity") == "error" ]] || continue
            file=$(jq ".diagnostics[$i].file" "$res")
            line=$(jq ".diagnostics[$i].range.start.line" "$res")
            endLine=$(jq ".diagnostics[$i].range.end.line" "$res")
            title=$(jq ".diagnostics[$i].rule" "$res")
            msg=$(jq ".diagnostics[$i].message" <<< "$res")
            echo "::error file=${file},line=${line},endLine=${endLine},title=${title}::${msg}"
          done
